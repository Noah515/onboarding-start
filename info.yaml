# Tiny Tapeout project information
project:
  title:        "ASIC Onboarding Project - Noah Kim"
  author:       "Noah Kim"
  discord:      "Molay25"
  description:  "SPI-controlled PWM peripheral for Tiny Tapeout."
  top_module:   "tt_um_uwasic_onboarding_noah_kim"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies?
  tiles: "1x1"

  # List your project's source files here.
  source_files:
    - "spi_peripheral.v"
    - "pwm_peripheral.v"
    - "project.v"

# Documentation block
documentation:
  author:       "Noah Kim"
  title:        "ASIC Onboarding Project - Noah Kim"
  language:     "Verilog"
  description:  "SPI-controlled PWM peripheral for Tiny Tapeout."
